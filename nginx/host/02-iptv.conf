# iptv.fresp.my.id — TLS on the host, playlist from the container on 127.0.0.1:8080.
# Certificate paths match `certbot certonly --webroot -d iptv.fresp.my.id`.
server {
    listen 80;
    listen [::]:80;
    server_name iptv.fresp.my.id;

    root /var/www/certbot;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iptv.fresp.my.id;

    ssl_certificate     /etc/letsencrypt/live/iptv.fresp.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iptv.fresp.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
