# Step 1 only: enable this long enough for certbot to answer the ACME challenge.
# Remove it once 02-iptv.conf is in place.
server {
    listen 80;
    listen [::]:80;
    server_name iptv.fresp.my.id;

    root /var/www/certbot;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
