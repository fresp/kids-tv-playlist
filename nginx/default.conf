server {
    listen 8080;
    server_name iptv.fresp.my.id;

    server_tokens off;
    root /srv/playlist;

    # Only top-level playlists are reachable; nothing else in the repo is served.
    location ~ ^/[A-Za-z0-9._-]+\.m3u8?$ {
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
